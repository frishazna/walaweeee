<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Greeny — Toko Tanaman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --page: #e6ebe3;
        --bg: #f3f5f0;
        --surface: #ffffff;
        --surface2: #eaefe7;
        --ink: #1e2a22;
        --muted: #66736b;
        --line: #dce3d9;
        --brand: #5b7f62;
        --brand-ink: #ffffff;
        --brand-soft: #dde8da;
        --heart: #c0576b;
        --warn: #b7791f;
        --ok: #3f7a4c;
        --imgbg: #e8ede5;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --page: #0c100d;
          --bg: #121814;
          --surface: #1b241e;
          --surface2: #243028;
          --ink: #e8eee9;
          --muted: #9aa89f;
          --line: #2d3a31;
          --brand: #7fa886;
          --brand-ink: #0f1a13;
          --brand-soft: #26372b;
          --heart: #e07a8f;
          --warn: #e0b060;
          --ok: #7fc38e;
        }
      }
      :root[data-theme="dark"] {
        --page: #0c100d;
        --bg: #121814;
        --surface: #1b241e;
        --surface2: #243028;
        --ink: #e8eee9;
        --muted: #9aa89f;
        --line: #2d3a31;
        --brand: #7fa886;
        --brand-ink: #0f1a13;
        --brand-soft: #26372b;
        --heart: #e07a8f;
        --warn: #e0b060;
        --ok: #7fc38e;
      }
      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        height: 100%;
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-align: inherit;
      }
      input {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
        border-radius: 6px;
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .view {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
      }
      .wrap {
        width: 100%;
        max-width: 1264px;
        margin: 0 auto;
        padding: 0 16px 28px;
      }
      .wrap.narrow {
        max-width: 640px;
      }
      /* header */
      .hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0 10px;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 5;
        gap: 8px;
      }
      .hd h1 {
        font-size: 17px;
        font-weight: 700;
        margin: 0;
        flex: 1;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
        font-weight: 800;
        color: var(--ink);
      }
      .logo svg {
        color: var(--brand);
      }
      .hi {
        display: flex;
        gap: 4px;
      }
      .ib {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        position: relative;
      }
      .ib:hover {
        background: var(--surface2);
      }
      .badge {
        position: absolute;
        top: 2px;
        right: 2px;
        min-width: 17px;
        height: 17px;
        border-radius: 9px;
        background: var(--brand);
        color: var(--brand-ink);
        font-size: 10px;
        font-weight: 700;
        display: grid;
        place-items: center;
        padding: 0 4px;
      }
      h2 {
        font-size: 16px;
        font-weight: 700;
        margin: 0;
      }
      .sec {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 22px 0 10px;
      }
      .link {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      .link:hover {
        color: var(--brand);
      }
      .muted {
        color: var(--muted);
      }
      /* hero */
      .hero {
        border-radius: 18px;
        background: var(--brand-soft);
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        overflow: hidden;
        min-height: 150px;
      }
      .hero .t {
        padding: 16px 0 16px 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
      }
      .hero h3 {
        margin: 0;
        font-size: 24px;
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .hero p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }
      .hero .a {
        background: var(--imgbg);
      }
      .hero .a svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .sbox {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0 12px;
        height: 44px;
        margin-top: 12px;
        color: var(--muted);
      }
      .sbox input {
        border: 0;
        background: none;
        flex: 1;
        outline: 0;
        min-width: 0;
        height: 100%;
      }
      .sbox:focus-within {
        border-color: var(--brand);
      }
      /* categories */
      .cats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .cat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 8px 4px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 11.5px;
        font-weight: 500;
      }
      .cat .cim {
        width: 46px;
        height: 46px;
        border-radius: 10px;
        background: var(--imgbg);
        overflow: hidden;
      }
      .cat svg.pl {
        width: 100%;
        height: 100%;
        display: block;
      }
      .cat:hover {
        border-color: var(--brand);
      }
      /* cards */
      .hs {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        margin: 0 -16px;
        padding: 0 16px 4px;
        scrollbar-width: none;
      }
      .mini {
        flex: 0 0 112px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .mini .pimg {
        aspect-ratio: 1;
      }
      .mini .pb {
        padding: 8px 9px 10px;
      }
      .mini .pn {
        font-size: 12px;
        font-weight: 600;
      }
      .mini .pp {
        font-size: 11.5px;
        color: var(--muted);
      }
      .pl.ph {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .pimg {
        position: relative;
        background: var(--imgbg);
        overflow: hidden;
      }
      .pimg svg.pl {
        width: 100%;
        height: 100%;
        display: block;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .pc {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        cursor: pointer;
        display: flex;
        flex-direction: column;
      }
      .pc:hover {
        border-color: var(--brand);
      }
      .pc .pimg {
        aspect-ratio: 1/1.05;
      }
      .pc .pb {
        padding: 10px 12px 12px;
      }
      .pn {
        font-weight: 600;
        font-size: 13px;
      }
      .pp {
        font-weight: 700;
        font-size: 13px;
        margin-top: 2px;
      }
      .at {
        margin-top: 8px;
        display: grid;
        gap: 5px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .at div {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .at svg {
        color: var(--brand);
        flex: none;
      }
      .hb {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: #44514a;
        display: grid;
        place-items: center;
      }
      .hb.on {
        color: var(--heart);
      }
      /* list rows */
      .row {
        display: flex;
        gap: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 10px;
        align-items: center;
        cursor: pointer;
        margin-bottom: 10px;
        width: 100%;
      }
      .row:hover {
        border-color: var(--brand);
      }
      .row .pimg {
        width: 76px;
        height: 84px;
        border-radius: 12px;
        flex: none;
      }
      .row .in {
        flex: 1;
        min-width: 0;
      }
      .row .at {
        margin-top: 4px;
        gap: 2px;
        font-size: 11px;
      }
      .match {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--brand);
        background: var(--brand-soft);
        border-radius: 99px;
        padding: 1px 8px;
        margin-left: 6px;
        vertical-align: 1px;
      }
      /* buttons */
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 46px;
        border-radius: 12px;
        background: var(--brand);
        color: var(--brand-ink);
        font-weight: 700;
        width: 100%;
        font-size: 14px;
      }
      .btn:hover {
        filter: brightness(1.06);
      }
      .btn.sm {
        height: 36px;
        font-size: 12.5px;
        width: auto;
        padding: 0 16px;
        border-radius: 10px;
      }
      .btn.ghost {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn.ghost:hover {
        border-color: var(--brand);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--brand-soft);
        border-radius: 99px;
        padding: 5px 8px 5px 12px;
        font-size: 12px;
        font-weight: 500;
      }
      .chip svg {
        opacity: 0.7;
      }
      .fs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .fs button {
        height: 42px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 600;
        font-size: 13px;
      }
      .fs button.on {
        background: var(--brand-soft);
        border-color: var(--brand);
      }
      .pager {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        margin-top: 20px;
      }
      .pager button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 600;
        color: var(--muted);
      }
      .pager button.on {
        background: var(--brand);
        color: var(--brand-ink);
      }
      .pager button[disabled] {
        opacity: 0.35;
        cursor: default;
      }
      /* nav */
      .nav {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--line);
        background: var(--surface);
        padding: 8px 8px 10px;
      }
      .nav button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 10.5px;
        color: var(--muted);
        font-weight: 500;
        padding: 4px 0;
        border-radius: 10px;
      }
      .nav button.on {
        color: var(--brand);
        font-weight: 700;
      }
      /* sheet */
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(15, 25, 18, 0.45);
        display: flex;
        align-items: flex-end;
        z-index: 20;
      }
      .sheet {
        background: var(--surface);
        width: 100%;
        max-height: 88%;
        border-radius: 22px 22px 0 0;
        display: flex;
        flex-direction: column;
      }
      .sheet .sh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px 6px;
      }
      .sheet .sh h2 {
        font-size: 17px;
      }
      .sbody {
        overflow-y: auto;
        padding: 0 18px 8px;
      }
      .sfoot {
        padding: 12px 18px 18px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        border-top: 1px solid var(--line);
      }
      .grp {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .grp:last-child {
        border: 0;
      }
      .grp h4 {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 700;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        width: 100%;
        font-size: 13px;
      }
      .cb,
      .rd {
        width: 18px;
        height: 18px;
        border: 1.6px solid var(--muted);
        border-radius: 5px;
        display: grid;
        place-items: center;
        flex: none;
        color: var(--brand-ink);
      }
      .rd {
        border-radius: 50%;
      }
      .opt.on .cb {
        background: var(--brand);
        border-color: var(--brand);
      }
      .opt.on .rd {
        border-color: var(--brand);
        box-shadow:
          inset 0 0 0 4px var(--surface),
          inset 0 0 0 10px var(--brand);
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--brand);
      }
      .rng {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .seg {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .seg button {
        padding: 8px 14px;
        border-radius: 99px;
        border: 1px solid var(--line);
        font-size: 12.5px;
        font-weight: 600;
      }
      .seg button.on {
        background: var(--brand);
        color: var(--brand-ink);
        border-color: var(--brand);
      }
      /* cards generic */
      .box {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
      }
      .prefc {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .prefc .lf {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--brand-soft);
        display: grid;
        place-items: center;
        color: var(--brand);
        flex: none;
      }
      /* detail */
      .dimg {
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        background: var(--imgbg);
        aspect-ratio: 1/0.9;
      }
      .dimg svg.pl {
        width: 100%;
        height: 100%;
        display: block;
      }
      .dtop {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        display: flex;
        justify-content: space-between;
      }
      .dtop .rb {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: #33403a;
        display: grid;
        place-items: center;
      }
      .dtop .rb.on {
        color: var(--heart);
      }
      .thumbs {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .thumbs button {
        width: 58px;
        height: 58px;
        border-radius: 12px;
        background: var(--imgbg);
        overflow: hidden;
        border: 2px solid transparent;
      }
      .thumbs button.on {
        border-color: var(--brand);
      }
      .thumbs svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .attrs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 14px 0;
      }
      .attrs div {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.25;
      }
      .attrs svg {
        color: var(--brand);
        flex: none;
      }
      .attrs b {
        display: block;
        color: var(--ink);
        font-weight: 600;
      }
      .tabs {
        display: flex;
        gap: 20px;
        border-bottom: 1px solid var(--line);
        margin-top: 16px;
      }
      .tabs button {
        padding: 8px 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tabs button.on {
        color: var(--ink);
        border-color: var(--brand);
      }
      .acc {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        overflow: hidden;
      }
      .acc .ah {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 13px 14px;
        font-weight: 600;
        font-size: 13px;
        border-top: 1px solid var(--line);
      }
      .acc .ah:first-child {
        border-top: 0;
      }
      .acc .ah svg {
        transition: transform 0.2s;
      }
      .acc .ah.on svg {
        transform: rotate(180deg);
      }
      .acc .ab {
        padding: 0 14px 14px;
        font-size: 13px;
        color: var(--muted);
      }
      .price {
        font-size: 20px;
        font-weight: 800;
        margin: 2px 0;
      }
      .stars {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .stars svg {
        color: #e0a526;
      }
      table.dt {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      table.dt td {
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
      }
      table.dt td:first-child {
        color: var(--muted);
        width: 42%;
      }
      /* cart */
      .ci {
        display: flex;
        gap: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .ci .pimg {
        width: 76px;
        height: 84px;
        border-radius: 12px;
        flex: none;
      }
      .ci .in {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .qty {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .qty button {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
      }
      .qrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .qrow .qlabel {
        font-size: 13px;
        font-weight: 600;
      }
      .qrow .qtot {
        margin-left: auto;
        font-size: 15px;
      }
      .qty button[disabled] {
        opacity: 0.35;
        cursor: default;
      }
      .qty span {
        min-width: 24px;
        text-align: center;
        font-weight: 600;
      }
      .sum {
        display: grid;
        gap: 8px;
        font-size: 13px;
      }
      .sum div {
        display: flex;
        justify-content: space-between;
      }
      .sum .tot {
        font-weight: 800;
        font-size: 16px;
        border-top: 1px dashed var(--line);
        padding-top: 10px;
        margin-top: 2px;
      }
      .disc {
        color: var(--ok);
      }
      .empty {
        text-align: center;
        padding: 48px 20px;
        color: var(--muted);
      }
      .empty .ei {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--brand-soft);
        color: var(--brand);
        display: grid;
        place-items: center;
        margin: 0 auto 14px;
      }
      .empty h3 {
        color: var(--ink);
        margin: 0 0 4px;
        font-size: 15px;
      }
      .empty p {
        margin: 0 0 16px;
        font-size: 13px;
      }
      .stick {
        position: sticky;
        bottom: 0;
        background: var(--bg);
        padding: 12px 0 4px;
        margin-top: 8px;
        border-top: 1px solid var(--line);
      }
      /* forms */
      .fld {
        display: grid;
        gap: 5px;
        margin-bottom: 10px;
      }
      .fld label {
        font-size: 12px;

      function qrSVG(seed) {
        let s = seed;
        const r = () => {

        const n = 25;
        let o = "";
        const fin = (x, y) =>
          `<rect x="${x}" y="${y}" width="7" height="7" fill="currentColor"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="currentColor"/>`;
        for (let y = 0; y < n; y++)
          for (let x = 0; x < n; x++) {
            if ((x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16))
              continue;
            if (r() > 0.52)
              o += `<rect x="${x}" y="${y}" width="1" height="1" fill="currentColor"/>`;
          }
        return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges" role="img" aria-label="Kode QRIS">${o}${fin(0, 0)}${fin(18, 0)}${fin(0, 18)}</svg>`;
      }

        return `${pad(Math.floor(t / 3600))}:${pad(Math.floor((t % 3600) / 60))}:${pad(t % 60)}`;

 <div class="ctr" style="margin:18px 0 2px"><div class="muted" style="font-size:12px">Total pembayaran · ${o.id}</div><div class="big">${rp(o.total)}</div><div style="font-size:12.5px;margin-top:2px">via <b>${m.n}</b></div></div>
 ${body}
 <div class="stick" style="display:grid;gap:8px"><button class="btn" data-a="paid" data-id="${o.id}">${m.type === "ew" ? "Saya sudah menyetujui di aplikasi" : "Saya sudah bayar"}</button><button class="btn ghost" data-a="changepay" data-id="${o.id}">Lihat pesanan di Akun</button></div>`
        );
      };
      V.success = (c) => {
        const o = S.orders.find((x) => x.id === c.oid),
          cod = o.method === "cod";
        return `<div class="ctr"><div class="okc">${ic("check", 44)}</div><h1 style="font-size:21px;font-weight:800;margin:0 0 4px">${cod ? "Pesanan berhasil dibuat" : "Pembayaran berhasil"}</h1><div class="muted" style="font-size:13px">Terima kasih, ${S.form.name.split(" ")[0]}! Tanamanmu segera kami kemas.</div></div>
 <div class="box sum" style="margin-top:20px"><div><span class="muted">Nomor pesanan</span><b>${o.id}</b></div><div><span class="muted">Metode</span><span>${PM[o.method].n}</span></div><div><span class="muted">Pengiriman</span><span>${SHIP[o.ship].n}</span></div><div class="tot"><span>${cod ? "Bayar ke kurir" : "Total dibayar"}</span><span>${rp(o.total)}</span></div></div>
 <div class="gl">Status pesanan</div><div class="box tl"><div><i class="on"></i><span><b>${cod ? "Pesanan dibuat" : "Pembayaran diterima"}</b><br><small class="muted">Baru saja</small></span></div><div><i class="on"></i><span><b>Dikemas</b><br><small class="muted">Tanaman dibungkus aman dengan pelindung daun</small></span></div><div><i></i><span><b>Dikirim</b><br><small class="muted">Estimasi ${SHIP[o.ship].d.split("· ")[1]}</small></span></div><div><i></i><span><b>Diterima</b></span></div></div>
 <div style="display:grid;gap:8px;margin-top:20px"><button class="btn" data-a="tab" data-v="home">Kembali belanja</button><button class="btn ghost" data-a="tab" data-v="akun">Lihat pesanan saya</button></div>`;
      };

      /* ---------- sheets ---------- */
      const filterGroups = (D, live) => {
        const o = (g, v, l) =>
          `<button class="opt ${D[g].includes(v) ? "on" : ""}" data-a="${live ? "fchk" : "chk"}" data-g="${g}" data-v="${v}"><span class="cb">${D[g].includes(v) ? ic("check", 13) : ""}</span>${l}</button>`;
        const so = (v, l) =>
          `<button class="opt ${D.sort === v ? "on" : ""}" data-a="${live ? "fsort" : "dsort"}" data-v="${v}"><span class="rd"></span>${l}</button>`;
        const id = live ? "fmaxlbl" : "maxlbl";
        return `<div class="grp"><h4>Harga</h4><input type="range" min="0" max="500000" step="5000" value="${D.max}" data-m="${live ? "fmax" : "max"}" aria-label="Harga maksimum"><div class="rng"><span>Rp 0</span><span id="${id}">${rp(D.max)}${D.max >= 500000 ? "+" : ""}</span></div></div>
 <div class="grp"><h4>Ukuran</h4>${o("size", "Kecil", "Kecil (< 30 cm)")}${o("size", "Sedang", "Sedang (30–100 cm)")}${o("size", "Besar", "Besar (≥ 100 cm)")}</div>
 <div class="grp"><h4>Kebutuhan Cahaya</h4>${o("light", "Rendah", "Cahaya rendah")}${o("light", "Sedang", "Cahaya sedang")}${o("light", "Terang", "Cahaya terang")}</div>
 <div class="grp"><h4>Tingkat Perawatan</h4>${o("care", "Mudah", "Mudah")}${o("care", "Sedang", "Sedang")}${o("care", "Sulit", "Sulit")}</div>
 <div class="grp"><h4>Urutkan berdasarkan</h4>${so("asc", "Harga (terendah–tertinggi)")}${so("desc", "Harga (tertinggi–terendah)")}${so("pop", "Popularitas")}</div>`;
      };
      function filterSheet() {
        return `<div class="sheet" role="dialog" aria-label="Filter"><div class="sh"><h2>Filter</h2><button class="ib" data-a="closesheet" aria-label="Tutup">${ic("close")}</button></div><div class="sbody" id="sbody">${filterGroups(S.D, false)}</div>
 <div class="sfoot"><button class="btn ghost" style="width:auto;padding:0 18px" data-a="dreset">Reset</button><button class="btn" data-a="apply">Terapkan</button></div></div>`;
      }
      function sortSheet() {
        const so = (v, l) =>
          `<button class="opt ${S.F.sort === v ? "on" : ""}" data-a="sortnow" data-v="${v}" style="padding:12px 0"><span class="rd"></span>${l}</button>`;
        return `<div class="sheet"><div class="sh"><h2>Urutkan</h2><button class="ib" data-a="closesheet" aria-label="Tutup">${ic("close")}</button></div><div class="sbody" style="padding-bottom:20px">${so("asc", "Harga (terendah–tertinggi)")}${so("desc", "Harga (tertinggi–terendah)")}${so("pop", "Popularitas")}</div></div>`;
      }
      function prefSheet() {
        const D = S.PD,
          g = (k, l, vals) =>
            `<div class="grp"><h4>${l}</h4><div class="seg">${vals.map((v) => `<button class="${D[k] === v ? "on" : ""}" data-a="setpref" data-k="${k}" data-v="${v}">${v}</button>`).join("")}</div></div>`;
        return `<div class="sheet"><div class="sh"><h2>Ubah Preferensi</h2><button class="ib" data-a="closesheet" aria-label="Tutup">${ic("close")}</button></div><div class="sbody">${g("place", "Tempat tanam", ["Indoor", "Outdoor"])}${g("care", "Tingkat perawatan", ["Mudah", "Sedang", "Sulit"])}${g("light", "Cahaya di rumahmu", ["Rendah", "Sedang", "Terang"])}</div><div class="sfoot" style="grid-template-columns:1fr"><button class="btn" data-a="savepref">Simpan preferensi</button></div></div>`;
      }

      /* ---------- render ---------- */
      const NAVS = {
        home: ["Home", "home"],
        kategori: ["Kategori", "grid"],
        fav: ["Favorit", "heart"],
        akun: ["Akun", "user"],
      };
      function topbar(active) {
        const L = [
          ["home", "Home"],
          ["kategori", "Kategori"],
          ["fav", "Favorit"],
          ["akun", "Akun"],
        ];
        return `<header class="top"><div class="topin"><button class="logo" data-a="tab" data-v="home">${ic("leafi", 28)}Greeny</button><nav class="tnav" aria-label="Menu utama">${L.map(([k, l]) => `<button class="${active === k ? "on" : ""}" data-a="tab" data-v="${k}">${l}</button>`).join("")}</nav>
 <div class="sbox tsearch">${ic("search", 18)}<input data-m="hq" placeholder="Cari tanaman, jenis, atau kebutuhan..." aria-label="Cari tanaman"></div>
 <div class="hi">${lampBtn()}<button class="ib" data-a="tab" data-v="fav" aria-label="Favorit">${ic("heart")}${S.fav.size ? `<span class="badge">${S.fav.size}</span>` : ""}</button>${bagBtn()}<button class="ib" data-a="tab" data-v="akun" aria-label="Akun">${ic("user")}</button></div></div></header>`;
      }
      function render(reset) {
        const c = cur(),
          old = $("#view"),
          sc = old ? old.scrollTop : 0,
          sb = $("#sbody"),
          sbs = sb ? sb.scrollTop : 0;
        const showNav = ["home", "kategori", "fav", "akun", "rec"].includes(
          c.n,
        );
        const active =
          c.n === "rec" ? "home" : c.n === "list" ? "kategori" : c.n;
        const narrow = ["payment", "success", "akun"].includes(c.n);
        const sheet = S.sheet
          ? `<div class="ov" data-a="closesheet" id="ov"><div style="width:100%" data-stop="1">${S.sheet === "filter" ? filterSheet() : S.sheet === "sort" ? sortSheet() : prefSheet()}</div></div>`
          : "";
        const proc = S.proc
          ? `<div class="proc"><div class="spin"></div>Memverifikasi pembayaran…</div>`
          : "";
        $("#app").innerHTML =
          `${topbar(active)}<div class="view" id="view"><div class="wrap ${narrow ? "narrow" : ""}">${V[c.n](c)}</div></div>${
            showNav
              ? `<nav class="nav">${Object.entries(NAVS)
                  .map(
                    ([k, [l, i]]) =>
                      `<button class="${active === k ? "on" : ""}" data-a="tab" data-v="${k}">${ic(i, 22, active === k && k === "fav" ? "currentColor" : "none")}${l}</button>`,
                  )
                  .join("")}</nav>`
              : ""
          }${sheet}${proc}`;
        const nv = $("#view");
        if (!reset) nv.scrollTop = sc;
        else nv.scrollTop = 0;
        const nsb = $("#sbody");
        if (nsb && sb) nsb.scrollTop = sbs;
        const ov = $("#ov");
        if (ov)
          ov.firstElementChild.addEventListener("click", (e) => {
            if (!e.target.closest("[data-a]")) e.stopPropagation();
          });
      }
      function go(n, p = {}) {
        S.stack.push({ n, ...p });
        S.sheet = null;
        render(true);
      }
      function back() {
        if (S.sheet) {
          S.sheet = null;
          return render();
        }
        if (S.stack.length > 1) {
          S.stack.pop();
          render(true);
        }
      }
      let tt;
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("on");
        clearTimeout(tt);
        tt = setTimeout(() => t.classList.remove("on"), 1900);
      }
      function addCart(id, q = 1) {
        const i = S.cart.find((x) => x.id === id);
        i ? (i.q += q) : S.cart.push({ id, q });
      }
      const refreshList = () => {
        $("#chipwrap").innerHTML = chipsHTML();
        $("#gridwrap").innerHTML = gridHTML();
      };

      /* ---------- actions ---------- */
      const A = {
        tab: (d) => {
          S.stack = [{ n: d.v }];
          S.sheet = null;
          render(true);
        },
        back: () => back(),
        open: (d) => {
          S.qty = 1;
          S.thumb = 0;
          S.dtab = "Deskripsi";
          S.open = {};
          go("detail", { id: +d.id });
        },
        fav: (d) => {
          const id = +d.id;
          S.fav.has(id)
            ? (S.fav.delete(id), toast("Dihapus dari favorit"))
            : (S.fav.add(id), toast("Ditambahkan ke favorit"));
          render();
        },
        search: () => {
          S.q = "";
          S.cat = null;
          S.F = defF();
          S.showSearch = true;
          S.page = 1;
          go("list");
        },
        togsearch: () => {
          S.showSearch = !S.showSearch;
          render();
        },
        cat: (d) => {
          S.cat = d.v === "all" ? null : d.v;
          S.q = "";
          S.F = defF();
          S.showSearch = false;
          S.page = 1;
          go("list");
        },
        rec: () => go("rec"),
        pg: (d) => {
          S.page = +d.v;
          refreshList();
          $("#view").scrollTop = 0;
        },
        openfilter: () => {
          S.D = JSON.parse(JSON.stringify(S.F));
          S.sheet = "filter";
          render();
        },
        opensort: () => {
          S.sheet = "sort";
          render();
        },
        closesheet: () => {
          S.sheet = null;
          render();
        },
        chk: (d) => {
          const a = S.D[d.g],
            i = a.indexOf(d.v);
          i > -1 ? a.splice(i, 1) : a.push(d.v);
          render();
        },
        dsort: (d) => {
          S.D.sort = d.v;
          render();
        },
        dreset: () => {
          S.D = defF();
          render();
        },
        fchk: (d) => {
          const a = S.F[d.g],
            i = a.indexOf(d.v);
          i > -1 ? a.splice(i, 1) : a.push(d.v);
          S.page = 1;
          render();
        },
        fsort: (d) => {
          S.F.sort = d.v;
          S.page = 1;
          render();
        },
        freset: () => {
          S.F = defF();
          S.cat = null;
          S.page = 1;
          render();
        },
        apply: () => {
          S.F = S.D;
          S.page = 1;
          S.sheet = null;
          render(true);
        },
        sortnow: (d) => {
          S.F.sort = d.v;
          S.page = 1;
          S.sheet = null;
          render(true);
        },
        rmchip: (d) => {
          if (d.k === "max") S.F.max = 500000;
          else if (d.k === "cat") S.cat = null;
          else S.F[d.k] = S.F[d.k].filter((v) => v !== d.v);
          S.page = 1;
          render();
        },
        resetall: () => {
          S.F = defF();
          S.cat = null;
          S.q = "";
          S.page = 1;
          render(true);
        },
        thumb: (d) => {
          S.thumb = +d.v;
          render();
        },
        dtab: (d) => {
          S.dtab = d.v;
          render();
        },
        acc: (d) => {
          S.open[d.v] = !S.open[d.v];
          render();
        },
        share: () => {
          try {
            navigator.clipboard.writeText(location.href);
          } catch (e) {}
          toast("Tautan produk disalin");
        },
        qinc: (d) => {
          if (S.qty < PBY(+d.id).stock) S.qty++;
          else toast("Stok maksimal tercapai");
          render();
        },
        qdec: () => {
          if (S.qty > 1) S.qty--;
          render();
        },
        add: (d) => {
          addCart(+d.id, S.qty);
          toast(S.qty + " tanaman ditambahkan ke keranjang");
          render();
        },
        buy: (d) => {
          addCart(+d.id, S.qty);
          go("checkout");
        },
        cart: () => go("cart"),
        inc: (d) => {
          addCart(+d.id);
          render();
        },
        dec: (d) => {
          const i = S.cart.find((x) => x.id === +d.id);
          if (i && i.q > 1) i.q--;
          render();
        },
        rm: (d) => {
          S.cart = S.cart.filter((x) => x.id !== +d.id);
          render();
        },
        checkout: () => {
          S.errs = {};
          go("checkout");
        },
        ship: (d) => {
          S.ship = d.v;
          render();
        },
        pay: (d) => {
          S.pay = d.v;
          render();
        },
        voucher: () => {
          if (S.voucher.trim().toUpperCase() === "GREENY10") {
            S.vOK = true;
            toast("Voucher dipakai");
          } else {
            S.vOK = false;
            toast("Kode voucher tidak valid");
          }
          render();
        },
        placeorder: () => {
          const E = {};
          ["name", "phone", "addr"].forEach((k) => {
            if (!S.form[k].trim()) E[k] = 1;
          });
          S.errs = E;
          if (Object.keys(E).length) {
            toast("Lengkapi alamat pengiriman dulu");
            render();
            return;
          }
          const c = calc(),
            cod = S.pay === "cod",
            seed = Math.floor(Math.random() * 9e8) + 1e8;
          const o = {
            id: "GRN-" + String(seed).slice(0, 6),
            seed,
            items: S.cart.map((x) => ({ ...x })),
            total: c.total,
            method: S.pay,
            ship: S.ship,
            paid: cod,
            exp: Date.now() + 36e5,
          };
          S.orders.unshift(o);
          S.cart = [];
          S.voucher = "";
          S.vOK = false;
          S.stack = cod
            ? [{ n: "home" }, { n: "success", oid: o.id }]
            : [{ n: "home" }, { n: "payment", oid: o.id }];
          S.sheet = null;
          render(true);
        },
        paid: (d) => {
          S.proc = true;
          render();
          setTimeout(() => {
            const o = S.orders.find((x) => x.id === d.id);
            o.paid = true;
            S.proc = false;
            S.stack = [{ n: "home" }, { n: "success", oid: o.id }];
            render(true);
          }, 1700);
        },
        changepay: () => {
          S.stack = [{ n: "akun" }];
          render(true);
        },
        payorder: (d) => {
          S.stack = [{ n: "home" }, { n: "payment", oid: d.id }];
          render(true);
        },
        copy: (d) => {
          try {
            navigator.clipboard.writeText(d.v);
          } catch (e) {}
          toast("Nomor disalin");
        },
        editpref: () => {
          S.PD = { ...S.prefs };
          S.sheet = "pref";
          render();
        },
        setpref: (d) => {
          S.PD[d.k] = d.v;
          render();
        },
        savepref: () => {
          S.prefs = S.PD;
          S.sheet = null;
          toast("Preferensi disimpan");
          render();
        },
        theme: () => {
          document.documentElement.dataset.theme = isDark() ? "light" : "dark";
          render();
        },
      };
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-a]");
        if (!el) return;
        if (
          el.id === "ov" &&
          e.target.closest("[data-stop]") &&
          !e.target.closest("[data-stop] [data-a]")
        )
          return;
        const f = A[el.dataset.a];
        if (f) f(el.dataset);
      });
      document.addEventListener("keydown", (e) => {
        if (
          e.key === "Enter" &&
          e.target.dataset &&
          e.target.dataset.m === "hq"
        ) {
          S.q = e.target.value;
          S.cat = null;
          S.F = defF();
          S.page = 1;
          S.showSearch = true;
          go("list");
        } else if (
          (e.key === "Enter" || e.key === " ") &&
          e.target.matches &&
          e.target.matches("[role=button],.pc")
        ) {
          e.preventDefault();
          e.target.click();
        }
      });
      document.addEventListener("input", (e) => {
        const m = e.target.dataset && e.target.dataset.m;
        if (!m) return;
        if (m === "fmax") {
          S.F.max = +e.target.value;
          $("#fmaxlbl").textContent =
            rp(S.F.max) + (S.F.max >= 500000 ? "+" : "");
          S.page = 1;
          refreshList();
        } else if (m === "max") {
          S.D.max = +e.target.value;
          $("#maxlbl").textContent =
            rp(S.D.max) + (S.D.max >= 500000 ? "+" : "");
        } else if (m === "q") {
          S.q = e.target.value;
          S.page = 1;
          refreshList();
        } else if (m === "voucher") S.voucher = e.target.value;
        else if (m in S.form) {
          S.form[m] = e.target.value;
          e.target.classList.remove("err");
        }
      });
      setInterval(() => {
        const el = $("#cd");
        if (!el) return;
        const c = cur();
        if (c.n !== "payment") return;
        const o = S.orders.find((x) => x.id === c.oid);
        if (o) el.textContent = cdText(o);
      }, 1000);
      matchMedia("(min-width:900px)").addEventListener("change", () =>
        render(),
      );
      matchMedia("(prefers-color-scheme: dark)").addEventListener(
        "change",
        () => render(),
      );
      render(true);
    </script>
  </body>
</html>
